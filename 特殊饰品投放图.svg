<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1020" viewBox="0 0 1540 1020" role="img" aria-labelledby="title desc">
  <title id="title">果园保卫战：大果园特殊饰品投放图</title>
  <desc id="desc">地图为 6788 乘 4808 像素，面积是前一版的五倍。中心出生点东侧投放雷种坠，东北投放旋叶环，北侧投放风种徽章，西北投放冰露铃，西南投放护芽坠，东南投放蜂群符。靠近五十六像素自动领取。领取后获得本局技能，可保留到无尽模式。按 M 或手机投放图按钮查看地图。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#112b23"/><stop offset="1" stop-color="#071a18"/>
    </linearGradient>
    <linearGradient id="land" x2="0" y2="1">
      <stop stop-color="#22483a"/><stop offset="1" stop-color="#17392f"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#7caa83" stroke-opacity=".10"/>
    </pattern>
    <pattern id="trees" width="105" height="98" patternUnits="userSpaceOnUse">
      <path d="M48 59V74" stroke="#637946" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="48" cy="46" rx="21" ry="20" fill="#285840"/>
      <circle cx="35" cy="46" r="13" fill="#2f6647"/>
      <circle cx="50" cy="32" r="14" fill="#37714c"/>
      <circle cx="61" cy="47" r="14" fill="#306548"/>
      <circle cx="42" cy="38" r="3" fill="#b1bb62" opacity=".50"/>
      <circle cx="58" cy="47" r="3" fill="#b1bb62" opacity=".50"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0L6 3L0 6" fill="none" stroke="#bbc994" stroke-width="1.3"/>
    </marker>
    <clipPath id="mapClip"><rect x="48" y="170" width="900" height="638" rx="22"/></clipPath>
    <style>
      text { font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif; }
      .title { font-size: 38px; font-weight: 800; fill: #fff0c4; }
      .eyebrow { font-size: 13px; letter-spacing: 3px; fill: #b9d490; }
      .subtitle { font-size: 16px; fill: #bfd1b2; }
      .tiny { font-size: 12px; fill: #9ab69d; }
      .label { font-size: 16px; font-weight: 700; fill: #fff4d5; }
      .map-label { paint-order: stroke; stroke: #15382b; stroke-width: 5px; stroke-linejoin: round; }
      .number { font-size: 18px; font-weight: 800; fill: #14271f; text-anchor: middle; dominant-baseline: central; }
      .legend-title { font-size: 18px; font-weight: 700; fill: #ffefc9; }
      .legend-detail { font-size: 13px; fill: #bbd0b8; }
      .caption { font-size: 14px; fill: #bdd2b7; }
    </style>
  </defs>
  <rect width="1540" height="1020" fill="url(#bg)"/>
  <rect x="18" y="18" width="1504" height="984" rx="27" fill="none" stroke="#567450"/>
  <text x="48" y="66" class="eyebrow">ORCHARD GUARDIANS / RELIC DROP MAP</text>
  <text x="48" y="115" class="title">大果园 · 特殊饰品投放图</text>
  <text x="48" y="146" class="subtitle">探索六个站点，领取饰品，解锁属于本局的技能。</text>
  <rect x="1130" y="65" width="362" height="68" rx="15" fill="#203e2c" stroke="#657c4b"/>
  <text x="1154" y="91" class="label">面积 × 5 / 世界 6788 × 4808</text>
  <text x="1154" y="117" class="tiny">相对前一版 · 相对最初地图面积 × 50</text>

  <!-- Full world map. Station centers use the same normalized x / y as relic-data.js. -->
  <g clip-path="url(#mapClip)">
    <rect x="48" y="170" width="900" height="638" fill="url(#land)"/>
    <rect x="48" y="170" width="900" height="638" fill="url(#grid)"/>
    <rect x="48" y="170" width="900" height="638" fill="url(#trees)" opacity=".62"/>
    <path d="M120 170C185 215 104 307 158 387S270 508 216 603S182 730 267 808" fill="none" stroke="#36655b" stroke-width="35"/>
    <path d="M120 170C185 215 104 307 158 387S270 508 216 603S182 730 267 808" fill="none" stroke="#729c8b" stroke-width="9" opacity=".35"/>
    <ellipse cx="739" cy="665" rx="143" ry="87" fill="#5c7144" opacity=".22"/>
    <ellipse cx="740" cy="312" rx="129" ry="94" fill="#829857" opacity=".15"/>
    <ellipse cx="471" cy="273" rx="118" ry="61" fill="#598375" opacity=".24"/>
    <ellipse cx="293" cy="655" rx="134" ry="85" fill="#7a645a" opacity=".18"/>
    <path d="M498 489L589.8 489L732 342.26L471 278.46L246 361.4L291 654.88L804 616.6L498 489" fill="none" stroke="#b6a575" stroke-width="27" opacity=".15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M498 489L576 489" fill="none" stroke="#bbc994" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow)"/>
    <path d="M602 473L718 355" fill="none" stroke="#bbc994" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow)"/>
    <path d="M713 337L494 284" fill="none" stroke="#bbc994" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow)"/>
    <path d="M449 287L268 352" fill="none" stroke="#bbc994" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow)"/>
    <path d="M250 384L287 631" fill="none" stroke="#bbc994" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow)"/>
    <path d="M315 653L781 619" fill="none" stroke="#bbc994" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow)"/>
    <path d="M785 610L522 498" fill="none" stroke="#bbc994" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow)"/>
    <text x="117" y="224" class="tiny map-label">露水溪</text>
    <text x="750" y="236" class="tiny map-label">旋叶林</text>
    <text x="455" y="224" class="tiny map-label">风种高地</text>
    <text x="688" y="739" class="tiny map-label">蜜蜂花田</text>
    <text x="130" y="736" class="tiny map-label">萌芽苗圃</text>

    <!-- Northern indicator and scale. -->
    <g transform="translate(895 220)">
      <path d="M0 28V-14M-9-1L0-14L9-1" fill="none" stroke="#d3ddb8" stroke-width="2"/>
      <text x="0" y="-25" class="label" text-anchor="middle">N</text>
      <text x="0" y="48" class="tiny" text-anchor="middle">北</text>
    </g>
    <g transform="translate(75 771)">
      <path d="M0-6V6M0 0H133M133-6V6" stroke="#aabf9a" stroke-width="2"/>
      <text x="66" y="-12" class="tiny" text-anchor="middle">约 1000 像素</text>
    </g>

    <!-- Spawn at .5 / .5. -->
    <circle cx="498" cy="489" r="38" fill="#173d2d" stroke="#acc980" stroke-width="1.5" stroke-dasharray="4 5"/>
    <circle cx="498" cy="489" r="15" fill="#ffd778"/>
    <path d="M496 474C484 457 507 457 512 466C509 473 502 476 496 474" fill="#98c878"/>
    <circle cx="493" cy="487" r="2" fill="#4f5f3d"/><circle cx="503" cy="487" r="2" fill="#4f5f3d"/>
    <path d="M493 495Q498 499 503 495" fill="none" stroke="#4f5f3d" stroke-width="1.8"/>
    <text x="498" y="544" class="label map-label" text-anchor="middle">中心起点</text>
    <text x="544" y="469" class="tiny map-label">约 692 px</text>

    <!-- 1 / lightning / .602, .50 -->
    <circle cx="589.8" cy="489" r="36" fill="#ffe48a" opacity=".12"/>
    <circle cx="589.8" cy="489" r="22" fill="#ffe48a" stroke="#fff3c6" stroke-width="2"/>
    <text x="589.8" y="489" class="number">1</text>
    <text x="615" y="525" class="label map-label">雷种坠</text>
    <!-- 2 / orbit / .76, .27 -->
    <circle cx="732" cy="342.26" r="36" fill="#a6ec9d" opacity=".12"/>
    <circle cx="732" cy="342.26" r="22" fill="#a6ec9d" stroke="#d5ffd0" stroke-width="2"/>
    <text x="732" y="342.26" class="number">2</text>
    <text x="732" y="391" class="label map-label" text-anchor="middle">旋叶环</text>
    <!-- 3 / dash / .47, .17 -->
    <circle cx="471" cy="278.46" r="36" fill="#8bdde8" opacity=".12"/>
    <circle cx="471" cy="278.46" r="22" fill="#8bdde8" stroke="#c7f8fb" stroke-width="2"/>
    <text x="471" y="278.46" class="number">3</text>
    <text x="471" y="327" class="label map-label" text-anchor="middle">风种徽章</text>
    <!-- 4 / frost / .22, .30 -->
    <circle cx="246" cy="361.4" r="36" fill="#a3dffa" opacity=".12"/>
    <circle cx="246" cy="361.4" r="22" fill="#a3dffa" stroke="#d2f0ff" stroke-width="2"/>
    <text x="246" y="361.4" class="number">4</text>
    <text x="246" y="410" class="label map-label" text-anchor="middle">冰露铃</text>
    <!-- 5 / shield / .27, .76 -->
    <circle cx="291" cy="654.88" r="36" fill="#f6bbd0" opacity=".12"/>
    <circle cx="291" cy="654.88" r="22" fill="#f6bbd0" stroke="#ffe2ee" stroke-width="2"/>
    <text x="291" y="654.88" class="number">5</text>
    <text x="291" y="704" class="label map-label" text-anchor="middle">护芽坠</text>
    <!-- 6 / bees / .84, .70 -->
    <circle cx="804" cy="616.6" r="36" fill="#ffc977" opacity=".12"/>
    <circle cx="804" cy="616.6" r="22" fill="#ffc977" stroke="#ffe7ad" stroke-width="2"/>
    <text x="804" y="616.6" class="number">6</text>
    <text x="804" y="666" class="label map-label" text-anchor="middle">蜂群符</text>
  </g>
  <rect x="48" y="170" width="900" height="638" rx="22" fill="none" stroke="#648769" stroke-width="1.5"/>

  <!-- Skill legend. -->
  <rect x="975" y="170" width="517" height="638" rx="22" fill="#132f25" stroke="#4a6d4d"/>
  <text x="998" y="208" class="legend-title">六个站点 / 六种技能</text>
  <text x="998" y="234" class="tiny">百分比伤害以玩家当前伤害计算，随局内升级成长。</text>
  <path d="M998 251H1469" stroke="#34543e"/>
  <g transform="translate(1000 281)">
    <circle cx="15" cy="1" r="15" fill="#ffe48a"/><text x="15" y="1" class="number" style="font-size:14px">1</text>
    <text x="42" y="6" class="legend-title">雷种坠 · 连锁雷种</text>
    <text x="42" y="31" class="legend-detail">每 4.5 秒雷击，最多 3 个目标，每只 115% 伤害。</text>
    <text x="42" y="52" class="tiny">索敌 430 px / 跳跃 160 px / 坐标 60.2%, 50%</text>
  </g>
  <g transform="translate(1000 370)">
    <circle cx="15" cy="1" r="15" fill="#a6ec9d"/><text x="15" y="1" class="number" style="font-size:14px">2</text>
    <text x="42" y="6" class="legend-title">旋叶环 · 护身旋叶</text>
    <text x="42" y="31" class="legend-detail">每 0.75 秒近身扫击，最多 6 个目标，24% 伤害。</text>
    <text x="42" y="52" class="tiny">攻击半径 96 px / 坐标 76%, 27%</text>
  </g>
  <g transform="translate(1000 459)">
    <circle cx="15" cy="1" r="15" fill="#8bdde8"/><text x="15" y="1" class="number" style="font-size:14px">3</text>
    <text x="42" y="6" class="legend-title">风种徽章 · 风种闪步</text>
    <text x="42" y="31" class="legend-detail">空格 / 手机技能键闪步 280 px，无敌 0.28 秒。</text>
    <text x="42" y="52" class="tiny">冷却 6 秒 / 沿移动方向 / 坐标 47%, 17%</text>
  </g>
  <g transform="translate(1000 548)">
    <circle cx="15" cy="1" r="15" fill="#a3dffa"/><text x="15" y="1" class="number" style="font-size:14px">4</text>
    <text x="42" y="6" class="legend-title">冰露铃 · 冰露脉冲</text>
    <text x="42" y="31" class="legend-detail">每 9 秒脉冲，50% 伤害，减速 40% 持续 2.6 秒。</text>
    <text x="42" y="52" class="tiny">半径 180 px / Boss 减速 20% / 坐标 22%, 30%</text>
  </g>
  <g transform="translate(1000 637)">
    <circle cx="15" cy="1" r="15" fill="#f6bbd0"/><text x="15" y="1" class="number" style="font-size:14px">5</text>
    <text x="42" y="6" class="legend-title">护芽坠 · 萌芽护盾</text>
    <text x="42" y="31" class="legend-detail">立即获得护盾，抵挡一次接触伤害，18 秒补充。</text>
    <text x="42" y="52" class="tiny">最多保留一层 / 坐标 27%, 76%</text>
  </g>
  <g transform="translate(1000 726)">
    <circle cx="15" cy="1" r="15" fill="#ffc977"/><text x="15" y="1" class="number" style="font-size:14px">6</text>
    <text x="42" y="6" class="legend-title">蜂群符 · 双蜂护卫</text>
    <text x="42" y="31" class="legend-detail">两只蜜蜂每 1.8 秒攻击，每只造成 60% 伤害。</text>
    <text x="42" y="52" class="tiny">索敌 560 px / 坐标 84%, 70%</text>
  </g>

  <!-- Pickup and persistence rules. -->
  <rect x="48" y="832" width="1444" height="139" rx="18" fill="#1c3827" stroke="#526f47"/>
  <text x="73" y="867" class="label">怎样领取</text>
  <text x="73" y="895" class="caption">走近投放点 56 px，自动领取饰品并解锁技能；每件每局只能领一次，可同时拥有全部六件。</text>
  <text x="73" y="922" class="caption">技能与领取状态保留到本局无尽模式；开始下一关时重新投放。按 M 或手机“投放图”按钮查看位置。</text>
  <text x="73" y="948" class="tiny">虚线为建议探索顺序，允许自由选择；树林与水系为区域示意，不表示碰撞墙。编号 / 颜色与游戏一致。</text>
</svg>
